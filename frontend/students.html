<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students | College Bus Management System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-wrap sidebar-brand">
        <span class="brand-mark">CB</span>
        <div><h2>Campus Transport</h2></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="students.html">Students</a>
        <a href="buses.html">Buses</a>
        <a href="routes.html">Routes</a>
        <a href="drivers.html">Drivers</a>
        <a href="registrations.html">Registrations</a>
        <a href="payments.html">Fees & Payments</a>
        <button id="logoutBtn" class="nav-logout">Logout</button>
      </nav>
    </aside>

    <main class="main-panel">
      <header class="topbar panel-header">
        <div>
          <p class="eyebrow">Records</p>
          <h1>Students</h1>
        </div>
        <div class="user-pill"><span id="userBadge">Loading...</span></div>
      </header>

      <section class="panel-box">
        <h3>Add or update student</h3>
        <form id="studentForm" class="form-grid">
          <input type="hidden" id="studentId" />
          <div><label>Student ID<input id="student_id" required /></label></div>
          <div><label>Name<input id="name" required /></label></div>
          <div><label>Email<input id="email" type="email" required /></label></div>
          <div><label>Phone<input id="phone" required /></label></div>
          <div><label>Department<input id="department" required /></label></div>
          <div><label>Academic Year<input id="academic_year" required /></label></div>
          <div><label>Status<select id="status"><option value="active">Active</option><option value="pending">Pending</option><option value="inactive">Inactive</option></select></label></div>
          <div class="form-actions span-two"><button class="btn btn-primary" type="submit">Save Student</button><button class="btn btn-secondary" type="button" id="resetStudentForm">Reset</button></div>
        </form>
      </section>

      <section class="panel-box">
        <div class="table-toolbar">
          <h3>Student list</h3>
          <input id="studentSearch" type="search" placeholder="Search by ID, name, or department" />
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>ID</th><th>Student ID</th><th>Name</th><th>Department</th><th>Year</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/students.js"></script>
</body>
</html>
